name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Validate catalog data and outputs
        run: |
          python3 scripts/update_catalog.py --check
          python3 scripts/discover_candidates.py --check --output discovery/candidates.md
